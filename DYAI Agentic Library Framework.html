  { t: T('Next pull', 'Next Pull'), target: 'wt-nextpull', s: T('The thread re-enters ASM — with more resolved knowledge. Old intent + new evidence.', 'Der Faden tritt wieder in ASM ein — mit mehr aufgelöstem Wissen. Alte Absicht + neue Evidenz.') },
  { t: T('Portfolio feedback', 'Portfolio-Feedback'), target: 'wt-feedback', s: T('Meaning is compressed upward. Activity is not mirrored upward.', 'Nach oben wird Bedeutung verdichtet. Aktivität wird nicht gespiegelt.') },
  { t: T('Closed loop', 'Geschlossener Loop'), target: 'wt-loop', s: T('One value-delivery loop: responsibilities, boundaries and evidence on one line.', 'Ein Value-Delivery-Loop: Verantwortungen, Grenzen und Evidenz auf einer Linie.') },
  { t: T('Harness architecture', 'Harness-Architektur'), target: 'wt-harness', s: T('Every governor follows the same harness grammar. Harness ≠ LLM.', 'Jeder Governor folgt derselben Harness-Grammatik. Harness ≠ LLM.') },
  { t: T('Platform-neutral framework', 'Plattformneutrales Framework'), target: 'wt-adapters', s: T('Toggle the bindings: the structure does not move. The tools are pluggable.', 'Bindings umschalten: Die Struktur bewegt sich nicht. Die Werkzeuge sind steckbar.') },
];

if (typeof module !== 'undefined') module.exports = { FW, T };

</script>
<script>
/* DYAI Agentic Delivery Framework — experience layer.
   Renders every chapter from FW (data.js), draws the Value Trace, runs
   scroll-stepped figures, detail sheets, walkthrough and toggles. */
(() => {
'use strict';
const E = FW.entities;
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const reduce = () => window.matchMedia('(prefers-reduced-motion: reduce)').matches;

const STATE = { lang: 'en', wt: -1, figLock: {}, sheetReturn: null, autonomy: 'transition', jira: 'semantic', adapters: 'dyai', recon: 'next-pull' };
try { const s = localStorage.getItem('dyai-adf-lang'); if (s === 'en' || s === 'de') STATE.lang = s; else if ((navigator.language || '').toLowerCase().startsWith('de')) STATE.lang = 'de'; } catch (e) { if ((navigator.language || '').toLowerCase().startsWith('de')) STATE.lang = 'de'; }

const L = v => v == null ? '' : (typeof v === 'string' ? v : (v[STATE.lang] != null ? v[STATE.lang] : v.en));
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const pad = n => String(n).padStart(2, '0');

/* ── DS primitives ─────────────────────────────────────────────────────── */
const MARKS = {
  broken: '<path d="M2 8h14"/><path d="M32 8h14"/><circle cx="24" cy="8" r="2" stroke-dasharray="2 2"/>',
  resolved: '<path d="M2 8h44"/><circle cx="24" cy="8" r="2.4" fill="currentColor"/>',
  system: '<path d="M4 8 16 3M4 8l12 5M16 3h14l10 5M16 13h14l10-5"/><circle cx="4" cy="8" r="1.6" fill="currentColor"/><circle cx="16" cy="3" r="1.6"/><circle cx="16" cy="13" r="1.6"/><circle cx="30" cy="3" r="1.6"/><circle cx="30" cy="13" r="1.6"/><circle cx="44" cy="8" r="1.6" fill="currentColor"/>',
  branch: '<path d="M2 8h16"/><path d="M18 8c8 0 8-5 16-5h12M18 8c8 0 8 5 16 5h12"/>',
  practice: '<path d="M2 8h44"/><path d="M8 5v6M16 5v6M24 5v6M32 5v6M40 5v6"/>',
  reduced: '<path d="M2 8h44"/><circle cx="12" cy="8" r="2.2" fill="currentColor"/><circle cx="24" cy="8" r="2.2" fill="currentColor"/><circle cx="36" cy="8" r="2.2" stroke-dasharray="1.5 1.5" opacity=".5"/>',
  bounded: '<path d="M8 8h32"/><path d="M8 3v10M40 3v10"/><path d="M2 8h3M43 8h3" stroke-dasharray="1 2"/>',
  reusable: '<path d="M2 8h12l6-5 6 5 6-5 6 5h8"/><circle cx="44" cy="8" r="1.6" fill="currentColor"/>',
  loop: '<path d="M2 8h30"/><path d="M32 8a5 5 0 1 0 10 0 5 5 0 1 0-10 0"/><path d="M42 8h4"/><circle cx="2" cy="8" r="1.6" fill="currentColor"/>',
};
const traceMark = st => `<svg class="trace-mark trace-mark--${st}" viewBox="0 0 48 16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round">${MARKS[st]}</svg>`;
const eyebrow = (st, label, inv) => `<div class="trace${inv ? ' trace--inverse' : ''}">${traceMark(st)}<span class="trace-label"><span class="trace-name">${L(T('Value trace', 'Value Trace'))}</span><span aria-hidden="true"> / </span>${L(label)}</span></div>`;
const ARROW = '<svg class="icon-arrow" viewBox="0 0 17 17" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 8.5h13M10.5 4l4.5 4.5-4.5 4.5"/></svg>';
const ARROW_DOWN = '<svg class="icon-arrow" viewBox="0 0 17 17" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8.5 2v13M4 10.5l4.5 4.5 4.5-4.5"/></svg>';
const meta = (html, cls = '') => `<span class="meta ${cls}">${html}</span>`;
const src = k => `<span class="src src--${k}" title="${esc(L(FW.statuses[k].note))}">${L(FW.statuses[k].label)}</span>`;
const name = id => L(E[id] ? E[id].name : id);
const obj = (id, label, cls = '') => `<button type="button" class="obj ${cls}" data-detail="${id}"><span class="obj-i" aria-hidden="true"></span>${label != null ? label : name(id)}</button>`;
const gateChip = (id, label) => { const g = E[id]; return `<button type="button" class="gate-chip${g.cls === 'evidence' ? ' ev' : ''}" data-detail="${id}"><span class="gm" aria-hidden="true"></span>${label || L(g.name)}</button>`; };
const handoffBtn = (id, attrs = '') => { const h = E[id]; return `<button type="button" class="handoff" data-detail="${id}" ${attrs}><span class="hf-mark" aria-hidden="true"></span><span><span class="hf-k">${L(T('Handoff', 'Handoff'))}</span><br><span class="hf-n">${L(h.name)}</span></span><span class="hf-r">${name(h.producer)} <span aria-hidden="true">→</span><span class="sr-only">${L(T('to', 'an'))}</span> <b>${name(h.consumer)}</b></span></button>`; };

function head(o) {
  return `<header class="ch-head wt-dimmable">
    ${eyebrow(o.state, o.trace, o.inverse)}
    <p class="level-tag">${meta(o.level)}</p>
    <h2 class="chapter-title${o.inverse ? ' chapter-title--light' : ''}">${L(o.title)}</h2>
    ${o.intro ? `<p class="chapter-intro${o.inverse ? ' chapter-intro--light' : ''}">${L(o.intro)}</p>` : ''}
    ${o.own ? `<dl class="ownership">${o.own.map(([k, v]) => `<div><dt>${meta(L(k))}</dt><dd>${v}</dd></div>`).join('')}</dl>` : ''}
  </header>`;
}
const stepsList = (fig, items) => `<ol class="steps" data-for="${fig}" style="--n:${items.length}">${items.map((s, i) => `<li data-i="${i}">${meta(`<span class="scenario-dot" aria-hidden="true"></span>${L(s[0])}`)}<span>${L(s[1])}</span></li>`).join('')}</ol>`;

const WIP = { fl3: T('WIP set by the Portfolio Governor', 'WIP durch den Portfolio Governor begrenzt'), fl2: T('WIP · one active Slice per stream', 'WIP · ein aktiver Slice pro Strom'), fl1: T('WIP · one run per Slice', 'WIP · ein Run pro Slice') };
const TOKENS = { fl3: ['portfolio-ready'], fl2: ['definition-ready', 'candidate'], fl1: ['executing'] };
/* ── Boards ────────────────────────────────────────────────────────────── */
function board(k, opts = {}) {
  const B = FW.boards[k], Lv = FW.levels[k];
  return `<figure class="board" id="fig-${k}" data-board="${k}" data-steps="${opts.steps || 1}" data-step="${(opts.steps || 1) - 1}" data-spine="tap" aria-label="${esc(Lv.code + ' ' + L(Lv.name))}">
    <figcaption class="board-cap">${meta(`<b>${Lv.code}</b> · ${L(T('Flow unit', 'Flow Unit'))} · <b>${name(B.unit)}</b> · ${L(WIP[k])}`)}<span style="display:flex;gap:16px;align-items:center;flex-wrap:wrap">${meta(L(T('Owner', 'Owner')) + ' · ' + name(Lv.owner))}${obj('board-' + k, L(T('About this board', 'Über dieses Board')), 'obj--plain')}</span></figcaption>
    <div class="board-grid" style="--cols:${B.stages.length}">
      ${B.stages.map((s, i) => `<button type="button" class="stage${s.gate ? ' is-gate' : ''}${(TOKENS[k] || []).includes(s.id) ? ' has-token' : ''}" data-stage="${s.id}" data-detail="stage:${k}:${s.id}"><span class="stage-n">${pad(i + 1)}</span><span class="stage-name">${L(s.name)}</span><span class="stage-m">${L(s.meaning)}</span>${s.note ? `<span class="stage-note">${L(T('Owned by the Delivery Governor — not self-certified', 'Vom Delivery Governor verantwortet — nicht selbst zertifiziert'))}</span>` : ''}</button>`).join('')}
      <svg class="board-svg" aria-hidden="true"></svg>
    </div>
  </figure>`;
}

/* ── Chapters ──────────────────────────────────────────────────────────── */
function chIntent() {
  return `<section class="chapter hero" id="ch-intent" data-loc="${esc(L(T('Human product authority', 'Human Product Authority')))}">
  <div class="page-shell laned">
    <div class="wt-dimmable">${meta(L(FW.meta.kicker))}</div>
    <div class="hero-grid" id="wt-intent">
      <div class="wt-dimmable">
        ${eyebrow('resolved', T('Intent · one coherent signal', 'Absicht · ein kohärentes Signal'))}
        <h1 class="hero-title" style="margin-top:26px" data-spine="origin" data-spine-at="0.36">${L(T('Autonomy begins with intent.', 'Autonomie beginnt mit Absicht.'))}</h1>
        <p class="hero-thesis"><span>${L(T('Vision becomes bounded product work.', 'Vision wird begrenzte Produktarbeit.'))}</span><span>${L(T('Product work becomes verified execution.', 'Produktarbeit wird verifizierte Ausführung.'))}</span><span>${L(T('Evidence returns as learning.', 'Evidenz kehrt als Lernen zurück.'))}</span></p>
        <div class="hero-actions">
          <button type="button" class="action-link" data-wt-start>${L(T('Start the walkthrough', 'Durchstich starten'))}${ARROW}</button>
          <a class="action-link action-link--secondary" href="#ch-fl3">${L(T('Follow the trace', 'Dem Faden folgen'))}${ARROW_DOWN}</a>
        </div>
      </div>
      <aside class="hero-aside wt-dimmable">
        ${meta(L(T('How to read this page', 'So liest man diese Seite')))}
        <p>${L(T('The blue line on the left is the Value Trace: the authorised meaning that must survive the whole system. It changes form only when its meaning changes.', 'Die blaue Linie links ist die Value Trace: die autorisierte Bedeutung, die das ganze System überleben muss. Sie ändert ihre Form nur, wenn sich ihre Bedeutung ändert.'))}</p>
        <div class="neg"><span>${L(T('It is not the ticket.', 'Sie ist nicht das Ticket.'))}</span><span>${L(T('It is not the agent.', 'Sie ist nicht der Agent.'))}</span><span>${L(T('It is not the workflow status.', 'Sie ist nicht der Workflow-Status.'))}</span><b>${L(T('It is the meaning that stays traceable through all of them.', 'Sie ist die Bedeutung, die durch alle hindurch nachverfolgbar bleibt.'))}</b></div>
        <p style="color:var(--muted)">${L(T('Scroll explains the framework. Every underlined object opens a detail sheet.', 'Der Scroll erklärt das Framework. Jedes unterstrichene Objekt öffnet ein Detail-Sheet.'))}</p>
      </aside>
    </div>
    <div class="authority wt-dimmable" data-spine="tap">
      <div>${meta(L(T('Where the trace is born', 'Wo der Faden entsteht')))}<h4 style="margin-top:8px">${obj('human-authority')}</h4><p style="margin-top:8px">${L(T('Autonomous execution inside bounded meaning.', 'Autonome Ausführung innerhalb begrenzter Bedeutung.'))}</p></div>
      <div><h4>${L(T('Vision', 'Vision'))}</h4><p>${L(T('What should exist and for whom.', 'Was existieren soll und für wen.'))}</p></div>
      <div><h4>${L(T('Strategic intent', 'Strategische Absicht'))}</h4><p>${L(T('Which change is worth investing in.', 'In welche Veränderung es sich zu investieren lohnt.'))}</p></div>
      <div><h4>${L(T('Boundaries', 'Grenzen'))}</h4><p>${L(T('What must not be done to get there.', 'Was auf dem Weg nicht getan werden darf.'))}</p></div>
      <div><h4>${obj('decision-cliff', L(T('Decision cliffs', 'Decision Cliffs')))}</h4><p>${L(T('Where autonomy must stop and ask.', 'Wo Autonomie stoppen und fragen muss.'))}</p></div>
    </div>
    <div class="wt-dimmable" style="margin-top:28px;max-width:640px">${handoffBtn('vision-context')}</div>
  </div></section>`;
}

function chFL3() {
  const own = [
    [T('Owner', 'Owner'), obj('portfolio-governor')],
    [T('Flow object', 'Flow-Objekt'), obj('initiative')],
    [T('Gate out', 'Gate hinaus'), gateChip('portfolio-ready')],
    [T('Hands over', 'Übergibt'), obj('project-outcome-context')],
  ];
  return `<section class="chapter" id="ch-fl3" data-loc="${esc('FL3 · ' + L(FW.levels.fl3.name))}">
  <div class="page-shell laned">
    ${head({ state: 'branch', trace: T('Intent · branches into possible paths', 'Absicht · verzweigt in mögliche Pfade'), level: `<b>${L(T('Flight level 3', 'Flight Level 3'))}</b> · ${L(FW.levels.fl3.name)}`, title: FW.levels.fl3.question,
      intro: T('The first board holds initiatives — investments in a strategic outcome. One intent can imply several projects; the Portfolio Governor chooses a path without erasing the others.', 'Das erste Board enthält Initiativen — Investitionen in ein strategisches Outcome. Eine Absicht kann mehrere Projekte implizieren; der Portfolio Governor wählt einen Pfad, ohne die anderen zu löschen.'), own })}
    <div class="block wt-dimmable" id="wt-fl3-board">
      ${board('fl3', { steps: 3 })}
      ${stepsList('fig-fl3', [
        [T('Idea', 'Idee'), T('An intent is named. The trace is still one line.', 'Eine Absicht ist benannt. Der Faden ist noch eine Linie.')],
        [T('Shaping', 'Shaping'), T('One initiative may imply different projects or paths. The trace branches — quietly.', 'Eine Initiative kann verschiedene Projekte oder Pfade implizieren. Der Faden verzweigt — leise.')],
        [T('Portfolio ready', 'Portfolio ready'), T('One path becomes the cobalt line. The others recede but stay visible: choice without erasing context.', 'Ein Pfad wird die Kobaltlinie. Die anderen treten zurück, bleiben aber sichtbar: Wahl, ohne Kontext zu löschen.')],
      ])}
    </div>
    <div class="block wt-dimmable" id="wt-fl3-gate">
      <div class="block-head"><h3>${L(T('The Initiative Contract makes delegation safe.', 'Der Initiative Contract macht Delegation sicher.'))}</h3><p>${L(T('Crossing PORTFOLIO_READY makes the trace more precise — it does not prove success. The line stays continuous.', 'Das Überschreiten von PORTFOLIO_READY macht den Faden präziser — es beweist keinen Erfolg. Die Linie bleibt durchgehend.'))}</p></div>
      <div class="gate-panel">
        <div>${gateChip('portfolio-ready')}<p class="gp-q">${L(E['portfolio-ready'].question)}</p><p class="gp-not">${L(E['portfolio-ready'].not)}</p>
          <div class="routes" style="margin-top:22px">
            <div class="route"><span class="rl" aria-hidden="true"></span><span>${meta(L(T('Ready', 'Ready')))}${L(T('Delegate: produce a Project Outcome Context.', 'Delegieren: einen Project Outcome Context erzeugen.'))}</span></div>
            <div class="route fail"><span class="rl" aria-hidden="true"></span><span>${meta(L(T('Not ready', 'Nicht ready')))}${L(T('Stay in Shaping. Nothing is pushed down to FL2.', 'In Shaping bleiben. Nichts wird nach FL2 gedrückt.'))}</span></div>
          </div>
        </div>
        <div class="doc" style="border:0">
          <div class="doc-head"><h4>${obj('initiative-contract')}</h4>${src('canonical')}</div>
          <ol class="doc-fields" style="--fc:2">${FW.initiativeFields.map((f, i) => `<li><span class="fi">${pad(i + 1)}</span>${L(f)}</li>`).join('')}</ol>
        </div>
      </div>
    </div>
  </div></section>`;
}

function chCondense() {
  return `<section class="chapter chapter--recess" id="ch-condense" data-loc="${esc(L(T('Handoff · FL3 → FL2', 'Handoff · FL3 → FL2')))}">
  <div class="page-shell laned">
    ${head({ state: 'reduced', trace: T('Meaning · condensed', 'Bedeutung · verdichtet'), level: `<b>${L(T('First transformation', 'Erste Transformation'))}</b> · FL3 → FL2`,
      title: T('Work is not copied between levels. Its meaning is condensed.', 'Arbeit wird nicht zwischen Ebenen kopiert. Ihre Bedeutung wird verdichtet.'),
      intro: T('The initiative does not move to another board. It produces a new object — the Project Outcome Context — that carries only the meaning this project needs. The Value Trace runs through both.', 'Die Initiative wandert auf kein anderes Board. Sie erzeugt ein neues Objekt — den Project Outcome Context —, der nur die Bedeutung trägt, die dieses Projekt braucht. Die Value Trace läuft durch beide.') })}
    <div class="block wt-dimmable" id="wt-condense">
      <div class="condense" data-spine="tap" data-spine-at="22">
        <div class="doc cd-a"><div class="doc-head vt-row"><h4>${obj('initiative')}</h4>${meta('FL3')}</div>
          <ol class="doc-fields" style="--fc:1">${FW.initiativeFields.map((f, i) => `<li><span class="fi">${pad(i + 1)}</span>${L(f)}</li>`).join('')}</ol></div>

/* ── Geometry helpers ──────────────────────────────────────────────────── */
const R = (el, base) => { const r = el.getBoundingClientRect(), b = base.getBoundingClientRect(); return { x: r.left - b.left, y: r.top - b.top, w: r.width, h: r.height, cx: r.left - b.left + r.width / 2, cy: r.top - b.top + r.height / 2, r: r.right - b.left, b: r.bottom - b.top }; };
const sq = (x, y, s, cls, attrs = '') => `<rect class="${cls}" x="${(x - s / 2).toFixed(1)}" y="${(y - s / 2).toFixed(1)}" width="${s}" height="${s}" ${attrs}/>`;
const f = n => n.toFixed(1);

/* Boards: lineage drawn from the columns that exist */
function drawBoard(fig) {
  const k = fig.dataset.board, grid = $('.board-grid', fig), svg = $('.board-svg', fig);
  const st = $$('.stage', grid), B = FW.boards[k];
  $$('.board-token,.board-empty', grid).forEach(n => n.remove());
  const g = grid.getBoundingClientRect();
  svg.setAttribute('viewBox', `0 0 ${f(g.width)} ${f(g.height)}`);
  const horiz = st.length > 1 && Math.abs(st[0].getBoundingClientRect().top - st[1].getBoundingClientRect().top) < 4;
  const rs = st.map(s => R(s, grid));
  let ly, P, U;
  if (horiz) { ly = g.height - 58; U = rs.map(r => ({ a: r.x, c: r.cx, b: r.r })); P = (u, v) => `${f(u)} ${f(ly + v)}`; }
  else { const lx = 22; U = rs.map(r => ({ a: r.y, c: r.y + 24, b: r.b })); P = (u, v) => `${f(lx + v)} ${f(u)}`; ly = lx; }
  const idx = id => B.stages.findIndex(s => s.id === id);
  const end = horiz ? g.width : g.height;
  let html = '';
  const tok = (i, label, from, empty) => {
    const el = document.createElement(empty ? 'span' : 'button');
    if (!empty) { el.type = 'button'; el.dataset.detail = B.unit; el.innerHTML = `<span class="mini-signal" aria-hidden="true"></span>${label}`; el.className = 'board-token stp'; }
    else { el.className = 'board-empty'; el.textContent = label; }
    if (from != null) el.dataset.from = from;
    if (horiz) { el.style.left = f(U[i].c) + 'px'; el.style.top = f(ly - (empty ? 70 : 34)) + 'px'; }
    else { el.style.left = '48px'; el.style.top = f(rs[i].b - 26) + 'px'; el.style.transform = 'translateY(-50%)'; }
    grid.appendChild(el);
  };
  if (k === 'fl3') {
    const sh = idx('shaping'), pr = idx('portfolio-ready'), ac = idx('active');
    const a = U[sh].a, b = U[pr].a, w = b - a, d = horiz ? 26 : 16;
    html += `<path class="ln ln-q" d="M${P(0, 0)} L${P(a, 0)}"/>`;
    html += `<path class="ln ln-n stp draw" pathLength="1" data-draw="1" data-recede="2" d="M${P(a, 0)} C${P(a + w * .35, 0)} ${P(a + w * .35, -d)} ${P(a + w * .7, -d)} L${P(b - 8, -d)}"/>`;
    html += `<path class="ln ln-n stp draw" pathLength="1" data-draw="1" data-recede="2" d="M${P(a, 0)} C${P(a + w * .35, 0)} ${P(a + w * .35, d)} ${P(a + w * .7, d)} L${P(b - 8, d)}"/>`;
    html += `<path class="ln ln-n stp draw" pathLength="1" data-draw="1" d="M${P(a, 0)} L${P(b, 0)}"/>`;
    const e1 = horiz ? [b - 4, ly - d] : [22 - d, b - 4], e2 = horiz ? [b - 4, ly + d] : [22 + d, b - 4];
    html += sq(e1[0], e1[1], 7, 'jn-o stp', 'data-from="1" data-recede="2"') + sq(e2[0], e2[1], 7, 'jn-o stp', 'data-from="1" data-recede="2"');
    html += `<path class="ln ln-q" d="M${P(b, 0)} L${P(U[ac].c, 0)}"/>`;
    html += `<path class="ln ln-v stp" data-from="2" d="M${P(U[pr].c - 6, -14)} L${P(U[pr].c - 6, 14)} M${P(U[pr].c + 6, -14)} L${P(U[pr].c + 6, 14)}"/>`;
    html += `<path class="ln ln-q ln-d stp" data-from="2" d="M${P(U[ac].c, 0)} L${P(end, 0)}"/>`;
    html += sq(...(horiz ? [U[ac].c, ly] : [22, U[ac].c]), 8, 'jn stp', 'data-from="2"');
    tok(pr, L(T('Initiative', 'Initiative')), 2);
    fig._geo = { horiz, ly, lx: 22, u0: U[0].c, uEnd: U[ac].c };
  } else if (k === 'fl2') {
    const dr = idx('definition-ready'), dl = idx('delivering');
    html += `<path class="ln ln-q ln-d" d="M${P(0, 0)} L${P(U[0].c, 0)}"/>`;
    html += `<path class="ln ln-q" d="M${P(U[0].c, 0)} L${P(U[dl].c, 0)}"/>`;
    html += `<path class="ln ln-v" d="M${P(U[dr].c - 6, -14)} L${P(U[dr].c - 6, 14)} M${P(U[dr].c + 6, -14)} L${P(U[dr].c + 6, 14)}"/>`;
    html += `<path class="ln ln-q ln-d" d="M${P(U[dl].c, 0)} L${P(end, 0)}"/>`;
    html += sq(...(horiz ? [U[0].c, ly] : [22, U[0].c]), 8, 'jn-o');
    tok(dr, L(T('Vertical Slice', 'Vertikaler Slice')), null);
    fig._geo = { horiz, ly, lx: 22, u0: U[0].c, uEnd: U[dl].c };
    tok(0, L(T('Appears only after ASM derivation', 'Erscheint erst nach ASM-Ableitung')), null, true);
  } else {
    const cr = idx('cell-ready'), ex = idx('executing'), cd = idx('candidate-ready'), vf = idx('verifying'), rp = idx('repair');
    html += `<path class="ln ln-q" d="M${P(0, 0)} L${P(U[cd].c, 0)}"/>`;
    html += `<path class="ln ln-v" d="M${P(U[cr].c - 6, -14)} L${P(U[cr].c - 6, 14)} M${P(U[cr].c + 6, -14)} L${P(U[cr].c + 6, 14)}"/>`;
    html += `<path class="ln ln-q ln-d" d="M${P(U[cd].c, 0)} L${P(end, 0)}"/>`;
    const rh = horiz ? -34 : 30;
    html += `<path class="ln ln-n ln-d" d="M${P(U[rp].c, 0)} C${P(U[rp].c, rh)} ${P(U[ex].c, rh)} ${P(U[ex].c, 0)}"/>`;
    html += sq(...(horiz ? [U[vf].c, ly] : [22, U[vf].c]), 8, 'jn-o');
    html += sq(...(horiz ? [U[cd].c, ly] : [22, U[cd].c]), 8, 'jn');
    tok(ex, L(T('Execution Run', 'Execution Run')), null);
    fig._geo = { horiz, ly, lx: 22, u0: U[0].c, uEnd: U[cd].c };
  }
  svg.innerHTML = html;
  fig.dataset.spineAt = horiz ? (R(grid, fig).y + ly) : (R(grid, fig).y + U[0].c);
}

/* ASM: practice line → gate → branches → selection → contraction */
function drawAsm() {
  const fig = $('#fig-asm'); if (!fig) return;
  const flow = $('.asm-flow', fig), svg = $('.asm-svg', fig);
  const nodes = $$('.asm-node', flow), gate = $('.asm-gate', flow), cands = $$('.asm-cand', flow);
  const fr = flow.getBoundingClientRect();
  svg.setAttribute('viewBox', `0 0 ${f(fr.width)} ${f(fr.height)}`);
  const c0 = nodes[0].getBoundingClientRect(), c1 = nodes[1].getBoundingClientRect();
  const horiz = Math.abs((c0.top + c0.height / 2) - (c1.top + c1.height / 2)) < 4;
  const rn = nodes.map(n => R(n, flow)), rg = R(gate, flow), rc = cands.map(c => R(c, flow));
  let h = '';
  if (horiz) {
    // the practice line runs just below the model, so the trace never crosses a label
    const ly = Math.max(...rn.map(r => r.b), rg.b) + 16;
    h += `<path class="ln ln-q" d="M0 ${f(ly)} H${f(rg.cx + 9)}"/>`;
    rn.forEach(r => { h += `<path class="ln ln-q" d="M${f(r.x + 14)} ${f(r.b)} V${f(ly)}"/>`; });
    for (let i = 0; i < rn.length - 1; i++) { const x = (rn[i].r + rn[i + 1].x) / 2; h += `<path class="ln ln-v" d="M${f(x)} ${f(ly - 6)} V${f(ly + 6)}" style="stroke-width:1.4"/>`; }
    h += `<path class="ln ln-v stp" data-from="1" d="M${f(rg.cx - 9)} ${f(rg.y)} V${f(ly + 14)} M${f(rg.cx + 9)} ${f(rg.y)} V${f(ly + 14)}"/>`;
    rc.forEach((c, i) => {
      const sel = cands[i].classList.contains('is-sel');
      h += `<path class="ln ln-n stp draw" pathLength="1" data-draw="2" ${sel ? '' : 'data-recede="3"'} d="M${f(rg.cx + 9)} ${f(ly)} C${f(rg.cx + 49)} ${f(ly)} ${f(c.x - 40)} ${f(c.b)} ${f(c.x)} ${f(c.b)}"/>`;
    });
    fig._geo = { horiz, ly, gx: rg.cx + 9 };
  } else {
    const x = 14;
    h += `<path class="ln ln-q" d="M${x} 0 V${f(rg.cy)}"/>`;
    rn.forEach((r, i) => { h += `<path class="ln ln-q" d="M${x} ${f(r.cy)} H${f(r.x)}"/>`; if (i < rn.length - 1) { const yy = (r.b + rn[i + 1].y) / 2; h += `<path class="ln ln-v" d="M${x - 6} ${f(yy)} H${x + 6}" style="stroke-width:1.4"/>`; } });
    h += `<path class="ln ln-v stp" data-from="1" d="M${x - 10} ${f(rg.y - 2)} H${x + 10} M${x - 10} ${f(rg.b + 2)} H${x + 10}"/>`;
    rc.forEach((c, i) => {
      const sel = cands[i].classList.contains('is-sel');
      h += `<path class="ln ln-n stp draw" pathLength="1" data-draw="2" ${sel ? '' : 'data-recede="3"'} d="M${x} ${f(rg.b)} V${f(c.b - 14)} Q${x} ${f(c.b)} ${x + 14} ${f(c.b)} H${f(c.x)}"/>`;
    });
    fig._geo = { horiz };
  }
  svg.innerHTML = h;
}

/* Condense: many fields converge into fewer */
function drawCondense() {
  const box = $('.condense'); if (!box) return;
  const mid = $('.cd-mid', box), svg = $('.cd-svg', box);
  const a = $$('.cd-a .doc-fields li', box), b = $$('.cd-b .doc-fields li', box);
  const m = mid.getBoundingClientRect();
  if (m.width < 40) { svg.innerHTML = ''; return; }
  svg.setAttribute('viewBox', `0 0 ${f(m.width)} ${f(m.height)}`);
  const ya = a.map(li => R(li, mid).cy), yb = b.map(li => R(li, mid).cy);
  const ha = R($('.cd-a .doc-head', box), mid).cy, hb = R($('.cd-b .doc-head', box), mid).cy;
  let h = '';
  const map = [0, 2, 3, 4, 8, 9, 12, 7]; // initiative fields that survive into the project context
  const tgt = [0, 1, 1, 0, 2, 3, 4, 5];
  ya.forEach((y, i) => {
    const j = map.indexOf(i);
    if (j >= 0) h += `<path class="ln ln-n" d="M0 ${f(y)} C${f(m.width * .55)} ${f(y)} ${f(m.width * .45)} ${f(yb[tgt[j]])} ${f(m.width)} ${f(yb[tgt[j]])}" style="opacity:.7"/>`;
    else h += `<path class="ln ln-q ln-d" d="M0 ${f(y)} H${f(m.width * .22)}"/>`;
  });
  svg.innerHTML = h;
}

/* Execution cell */
function drawCell() {
  const fig = $('#fig-cell'); if (!fig) return;
  const area = $('.cell-area', fig), svg = $('svg', area);
  $$('.cell-tag', area).forEach(n => n.remove());
  const A = area.getBoundingClientRect(), W = A.width, H = A.height;
  svg.setAttribute('viewBox', `0 0 ${f(W)} ${f(H)}`);
  const rowY = id => { const el = $(`[data-row="${id}"]`, fig); const r = el.getBoundingClientRect(); return r.top - A.top + r.height / 2; };
  const vr = $('[data-row="value"]', fig).getBoundingClientRect(); const yv = vr.top - A.top + vr.height - 12; fig._vy = yv;
  const xs = W * .12, xe = W * .8, xc = W * .95;
  const caps = FW.capabilities.map(c => ({ id: c.id, y: rowY(c.id) }));
  let h = '';
  h += `<path class="ln ln-q" d="M${f(xs)} 10 V${f(H - 10)} M${f(xs - 5)} 10 H${f(xs + 5)} M${f(xs - 5)} ${f(H - 10)} H${f(xs + 5)} M${f(xe)} 10 V${f(H - 10)} M${f(xe - 5)} 10 H${f(xe + 5)} M${f(xe - 5)} ${f(H - 10)} H${f(xe + 5)}"/>`;
  caps.forEach((c, i) => {
    h += `<path class="ln ln-n stp draw" pathLength="1" data-draw="0" d="M0 ${f(c.y)} H${f(xe)}"/>`;
    h += `<path class="ln ln-n stp draw" pathLength="1" data-draw="4" d="M${f(xe)} ${f(c.y)} C${f(xe + (xc - xe) * .55)} ${f(c.y)} ${f(xe + (xc - xe) * .45)} ${f(yv)} ${f(xc)} ${f(yv)}"/>`;
    const pos = c.id === 'cap-review' ? [.7, .88] : [.25 + i * .03, .55 + i * .02];
    pos.forEach(p => { const x = xs + (xe - xs) * p; h += sq(x, c.y, 9, 'jn-o stp', 'data-from="1"') + sq(x, c.y, 9, 'jn stp', `data-from="${c.id === 'cap-testing' && p > .5 ? 4 : 2}"`); });
    if (c.id === 'cap-testing') {
      const x1 = xs + (xe - xs) * .6, x2 = xs + (xe - xs) * .74;
      h += `<path class="ln ln-n ln-d stp draw" pathLength="1" data-draw="3" d="M${f(x1)} ${f(c.y)} C${f(x1)} ${f(c.y + 24)} ${f(x2)} ${f(c.y + 24)} ${f(x2)} ${f(c.y)}"/>`;
      h += sq(x2, c.y, 9, 'jn stp', 'data-from="3"');
      tag(area, L(T('Bounded retry', 'Begrenzter Retry')), (x1 + x2) / 2, c.y + 26, '', 3);
    }
    if (c.id === 'cap-api') {
      const x0 = xs + (xe - xs) * .42, x1 = xe - 30, y1 = Math.max(16, c.y - 30);
      h += `<path class="ln ln-w stp draw" pathLength="1" data-draw="3" d="M${f(x0)} ${f(c.y)} C${f(x0 + 40)} ${f(c.y)} ${f(x0 + 60)} ${f(y1)} ${f(x1)} ${f(y1)}"/>`;
      h += sq(x1, y1, 8, 'jn-w stp', 'data-from="3"');
      tag(area, W < 420 ? L(T('Scope drift · stop', 'Scope Drift · Stopp')) : L(T('Scope drift → stop condition · not in candidate', 'Scope Drift → Stoppbedingung · nicht im Candidate')), (x0 + x1) / 2 + 20, y1 - 2, 'warn', 3, true);
    }
  });
  h += `<path class="ln ln-q" d="M0 ${f(yv)} H${f(W)}"/>`;
  h += sq(xc, yv, 11, 'jn stp', 'data-from="4"');
  svg.innerHTML = h;
  tag(area, W < 420 ? L(T('Cell', 'Cell')) : L(T('Execution Cell · temporary', 'Execution Cell · temporär')), (xs + xe) / 2, 12, '', null);
  tag(area, L(T('Candidate', 'Candidate')), xc - 8, yv + 22, 'vt', 4);
}
function tag(area, text, x, y, cls, from, top) {
  const s = document.createElement('span');
  s.className = 'cell-tag stp ' + (cls || '');
  s.textContent = text; s.style.left = f(x) + 'px'; s.style.top = f(y) + 'px';
  if (from != null) s.dataset.from = from;
  area.appendChild(s);
  const w = s.offsetWidth, aw = area.clientWidth;
  if (x - w / 2 < 2) s.style.left = f(w / 2 + 2) + 'px';
  if (x + w / 2 > aw - 2) s.style.left = f(aw - w / 2 - 2) + 'px';
}

/* Plumbline: two lines meet */
function drawPlumb() {

  if (list) $$('li', list).forEach((li, i) => { li.classList.toggle('is-active', i === n); li.classList.toggle('is-past', i < n); });
  if (fig.dataset.board === 'fl3') { const cur = ['idea', 'shaping', 'portfolio-ready'][n]; $$('.stage', fig).forEach(s => s.classList.toggle('is-cur', s.dataset.stage === cur)); }
}
function stepFigures() {
  const vh = innerHeight;
  $$('[data-steps]').forEach(fig => {
    const n = parseInt(fig.dataset.steps, 10) || 1;
    if (STATE.figLock[fig.id] != null) { setStep(fig, STATE.figLock[fig.id]); return; }
    if (n === 1 || reduce()) { setStep(fig, n - 1); return; }
    const r = fig.getBoundingClientRect();
    const p = (vh * .82 - r.top) / (r.height * .7 + vh * .3);
    setStep(fig, Math.floor(Math.max(0, Math.min(.999, p)) * n));
  });
  const lp = $('.lineage'); if (lp) { const r = lp.getBoundingClientRect(); lp.style.setProperty('--lp', reduce() ? 1 : Math.max(0.02, Math.min(1, (innerHeight * .85 - r.top) / (innerHeight * .4)))); }
  const loop = $('.loopdraw'); if (loop) { const r = loop.closest('figure').getBoundingClientRect(); loop.classList.toggle('on', reduce() || r.top < innerHeight * .7); }
}

/* ── Location + header ─────────────────────────────────────────────────── */
function updateLoc() {
  const y = innerHeight * .4; let cur = null;
  $$('.chapter').forEach(c => { const r = c.getBoundingClientRect(); if (r.top <= y && r.bottom > y) cur = c; });
  const t = $('#loc-text'); if (t && cur) { const v = cur.dataset.loc || ''; if (t.textContent !== v) t.textContent = v; }
  const hdr = $('#hdr'); if (hdr) hdr.classList.toggle('site-header--compact', scrollY > 48);
}

let ticking = false;
function onScroll() { if (ticking) return; ticking = true; requestAnimationFrame(() => { ticking = false; spineProgress(); stepFigures(); updateLoc(); }); }
function layoutAll() {
  $$('.board[data-board]').forEach(drawBoard);
  drawAsm(); drawCondense(); drawCell(); drawReturn(); drawPlumb();
  $$('[data-steps]').forEach(fig => { delete fig.dataset.inited; const s = +fig.dataset.step; setStep(fig, s); });
  buildSpine();
  stepFigures(); spineProgress();
  if (STATE.wt >= 0) wtApply(false);
}

/* ── Detail sheet ──────────────────────────────────────────────────────── */
const KIND = { role: T('Role', 'Rolle'), object: T('Flow object', 'Flow-Objekt'), gate: T('Gate', 'Gate'), handoff: T('Handoff', 'Handoff'), board: T('Board', 'Board'), method: T('Method', 'Methode'), capability: T('Capability', 'Capability'), adapter: T('Adapter', 'Adapter'), harness: T('Harness', 'Harness'), boundary: T('Boundary', 'Grenze'), stage: T('Board stage', 'Board-Stufe') };
function entityFor(id) {
  if (id.startsWith('stage:')) {
    const [, k, s] = id.split(':'); const B = FW.boards[k], st = B.stages.find(x => x.id === s), Lv = FW.levels[k];
    return { kind: 'stage', status: 'canonical', name: T(`${Lv.code} · ${st.name.en}`, `${Lv.code} · ${st.name.de}`), what: st.meaning,
      owner: Lv.owner, gates: st.gate ? [st.gate] : null, flowUnit: B.unit,
      not: st.note ? T('Independent delivery verification is owned by the Delivery Governor / verification path, not self-certified by the executor.', 'Unabhängige Delivery-Verifikation gehört dem Delivery Governor / Verifikationspfad, nicht der Selbstzertifizierung des Executors.') : (k === 'fl2' && s === 'candidate' ? T('DERIVATION_READY is not this column. It is checked on the product model before a Slice exists.', 'DERIVATION_READY ist nicht diese Spalte. Es wird am Produktmodell geprüft, bevor ein Slice existiert.') : null),
      related: ['board-' + k, B.unit] };
  }
  return E[id];
}
function openDetail(id, trigger) {
  const e = entityFor(id); if (!e) return;
  const row = (label, html, cls = '') => html ? `<div class="sh-row ${cls}">${meta(L(label))}<div>${html}</div></div>` : '';
  const ref = x => x && E[x] ? obj(x) : '';
  const lv = e.level ? ' · ' + FW.levels[e.level].code : '';
  let h = `${meta(L(KIND[e.kind] || T('Element', 'Element')) + lv)}<h2 id="sheet-title">${L(e.name)}</h2>`;
  h += row(T('What is this?', 'Was ist das?'), e.what ? `<p>${L(e.what)}</p>` : '');
  h += row(T('Question answered', 'Beantwortete Frage'), e.question ? `<p class="sh-q">${L(e.question)}</p>` : '');
  h += row(T('Owner', 'Owner'), ref(e.owner));
  if (e.kind === 'handoff') {
    h += row(T('Producer → consumer', 'Erzeuger → Konsument'), `<div class="sh-flow">${ref(e.producer)}<span class="ar" aria-hidden="true">→</span>${ref(e.consumer)}</div>`);
    h += row(T('Required content', 'Pflichtinhalt'), e.content ? `<p>${L(e.content)}</p>` : '');
    h += row(T('Intentionally excluded', 'Bewusst ausgeschlossen'), e.excluded ? `<p>${L(e.excluded)}</p>` : '');
    h += row(T('Gate before handoff', 'Gate vor dem Handoff'), e.gate ? gateChip(e.gate) : `<p style="color:var(--muted)">${L(T('No gate of its own — produced inside a governed step.', 'Kein eigenes Gate — entsteht in einem gesteuerten Schritt.'))}</p>`);
  }
  if (e.flowUnit) h += row(T('Flow unit here', 'Flow Unit hier'), ref(e.flowUnit));
  h += row(T('Input', 'Input'), e.input ? `<p>${L(e.input)}</p>` : '');
  h += row(T('Work', 'Arbeit'), e.work ? `<p>${L(e.work)}</p>` : '');
  h += row(T('Output', 'Output'), e.output ? `<p>${L(e.output)}</p>` : '');
  h += row(T('Next handoff', 'Nächster Handoff'), ref(e.next));
  if (e.kind !== 'handoff') h += row(T('Gates', 'Gates'), e.gates && e.gates.length ? `<div class="sh-links">${e.gates.map(g => gateChip(g)).join('')}</div>` : '');
  if (e.kind === 'gate') h += row(T('Gate class', 'Gate-Klasse'), `<p>${e.cls === 'evidence' ? L(T('Evidence / reality — has the claimed result actually been demonstrated?', 'Evidenz / Realität — wurde das behauptete Ergebnis tatsächlich nachgewiesen?')) : L(T('Readiness / sufficiency — do we know enough to safely continue?', 'Readiness / Suffizienz — wissen wir genug, um sicher weiterzumachen?'))}</p>`);
  h += row(T('Failure routes', 'Fehlerrouten'), e.failure ? `<p>${L(e.failure)}</p>` : '');
  h += row(T('Autonomy', 'Autonomie'), e.autonomy ? `<p>${L(e.autonomy)}</p>` : '');
  h += row(T('Adapters', 'Adapter'), e.adapters ? `<p>${L(e.adapters)}</p>` : '');
  h += row(T('What this is not', 'Was das nicht ist'), e.not ? `<p>${L(e.not)}</p>` : '', 'not');
  h += row(T('Source note', 'Quellenhinweis'), e.srcNote ? `<p>${L(e.srcNote)}</p>` : '');
  h += row(T('Source status', 'Source-Status'), `${src(e.status || 'canonical')}<p style="margin-top:8px;color:var(--muted);font-size:14px">${L(FW.statuses[e.status || 'canonical'].note)}</p>`);
  h += row(T('Related', 'Verwandt'), e.related ? `<div class="sh-links">${e.related.filter(r => E[r] || r.startsWith('stage:')).map(r => obj(r)).join('')}</div>` : '');
  showSheet(L(T('Detail', 'Detail')), h, trigger);
}
function openLaws(trigger) {
  let h = `${meta(L(T('Optional concept layer', 'Optionale Konzeptebene')))}<h2 id="sheet-title">${L(T('Framework laws.', 'Framework-Gesetze.'))}</h2>`;
  h += FW.laws.map(l => `<div class="law"><span class="neq">${L(l.a)}<span class="op">≠</span>${L(l.b)}</span><button type="button" class="text-button" data-goto="${l.at}">${L(T('Where it shows', 'Wo es sichtbar wird'))} →</button></div>`).join('');
  h += FW.lawStatements.map(l => `<div class="law"><span style="font-size:17px;font-weight:500;letter-spacing:-.01em">${L(l.s)}</span><button type="button" class="text-button" data-goto="${l.at}">${L(T('Where it shows', 'Wo es sichtbar wird'))} →</button></div>`).join('');
  h += `<div class="sh-row" style="margin-top:20px">${meta(L(T('Source status legend', 'Legende Source-Status')))}<div style="display:grid;gap:12px">${Object.keys(FW.statuses).map(k => `<div>${src(k)}<p style="margin-top:6px;color:var(--muted);font-size:14px">${L(FW.statuses[k].note)}</p></div>`).join('')}</div></div>`;
  h += `<p style="margin-top:18px;color:var(--muted);font-size:14px">${L(T('Status assignments follow the wording of the October 2026 design brief and are an editorial reading, not a verified record.', 'Die Status-Zuordnung folgt der Wortwahl des Design-Briefs vom Oktober 2026 und ist eine redaktionelle Lesart, kein verifizierter Nachweis.'))}</p>`;
  showSheet(L(T('Laws', 'Gesetze')), h, trigger);
}
function showSheet(kind, html, trigger) {
  const sh = $('#sheet'), bd = $('#sheet-bd');
  if (!sh.classList.contains('open')) STATE.sheetReturn = trigger || document.activeElement;
  $('#sheet-kind').textContent = kind; $('#sheet-body').innerHTML = html; $('#sheet-body').scrollTop = 0;
  sh.classList.add('open'); bd.classList.add('open'); sh.setAttribute('aria-hidden', 'false');
  document.body.classList.add('dialog-open');
  setTimeout(() => { const t = $('#sheet-close'); t && t.focus(); }, 30);
}
function closeSheet() {
  const sh = $('#sheet'); if (!sh || !sh.classList.contains('open')) return;
  sh.classList.remove('open'); $('#sheet-bd').classList.remove('open'); sh.setAttribute('aria-hidden', 'true');
  document.body.classList.remove('dialog-open');
  const r = STATE.sheetReturn; if (r && document.contains(r)) r.focus({ preventScroll: true });
}

/* ── Walkthrough ───────────────────────────────────────────────────────── */
function wtStart(i = 0) { STATE.wt = i; $('#wt').classList.add('open'); $('#wt').setAttribute('aria-hidden', 'false'); document.body.classList.add('wt-on'); wtApply(true); setTimeout(() => $('#wt-next').focus({ preventScroll: true }), 50); }
function wtExit() {
  STATE.wt = -1; STATE.wtReachL = null; STATE.figLock = {};
  $('#wt').classList.remove('open'); $('#wt').setAttribute('aria-hidden', 'true'); document.body.classList.remove('wt-on');
  $$('.wt-target').forEach(n => n.classList.remove('wt-target')); $$('.wt-keep').forEach(n => { if (!n.closest('.hero')) n.classList.remove('wt-keep'); });
  $$('.ladder > div').forEach(d => d.classList.remove('is-hl'));
  onScroll();
}
function wtApply(scroll) {
  const s = FW.walkthrough[STATE.wt]; if (!s) return;
  const el = document.getElementById(s.target); if (!el) return;
  $$('.wt-target').forEach(n => n.classList.remove('wt-target'));
  $$('.wt-keep').forEach(n => n.classList.remove('wt-keep'));
  el.classList.add('wt-target');
  const blk = el.classList.contains('wt-dimmable') ? el : el.closest('.wt-dimmable'); if (blk) blk.classList.add('wt-keep');
  $$('.wt-dimmable', el).forEach(n => n.classList.add('wt-keep'));
  STATE.figLock = {}; if (s.fig) STATE.figLock[s.fig[0]] = s.fig[1];
  $$('.ladder > div').forEach(d => d.classList.toggle('is-hl', d.id === s.hl));
  const M = $('#main').getBoundingClientRect(), r = el.getBoundingClientRect();
  const y0 = r.top - M.top, y1 = r.bottom - M.top;
  STATE.wtReachL = SP ? SP.lAtY(y1) : null;
  const cr = $('#spclip-r'); if (cr) { cr.setAttribute('y', f(y0 - 40)); cr.setAttribute('height', f(y1 - y0 + 80)); }
  $('#wt-count').textContent = `${L(T('Walkthrough', 'Durchstich'))} · ${pad(STATE.wt + 1)} / ${FW.walkthrough.length}`;
  $('#wt-title').textContent = L(s.t); $('#wt-text').textContent = L(s.s);
  $$('#wt-prog i').forEach((n, i) => { n.className = i < STATE.wt ? 'done' : i === STATE.wt ? 'cur' : ''; });
  $('#wt-prev').disabled = STATE.wt === 0;
  $('#wt-next').innerHTML = STATE.wt === FW.walkthrough.length - 1 ? L(T('Finish', 'Abschließen')) + ARROW : L(T('Next', 'Weiter')) + ARROW;
  if (scroll) {
    const hh = $('#hdr').offsetHeight, panel = $('#wt').offsetHeight;
    const avail = innerHeight - hh - (innerWidth <= 680 ? panel : 0);
    let top = scrollY + r.top - hh - 24;
    if (r.height < avail - 60) top = scrollY + r.top - hh - (avail - r.height) / 2;
    window.scrollTo({ top: Math.max(0, top), behavior: reduce() ? 'auto' : 'smooth' });
  }
  onScroll();
}

/* ── Events ────────────────────────────────────────────────────────────── */
function bindStatic() {
  // toggles that re-render only their own part
  $$('[data-jira]').forEach(b => b.addEventListener('click', () => { STATE.jira = b.dataset.jira; $$('[data-jira]').forEach(x => x.setAttribute('aria-pressed', x === b)); $$('.jira-views table').forEach(t => { t.hidden = t.dataset.view !== STATE.jira; }); }));
  $$('[data-adapters]').forEach(b => b.addEventListener('click', () => { STATE.adapters = b.dataset.adapters; $$('[data-adapters]').forEach(x => x.setAttribute('aria-pressed', x === b)); $('.adapters').dataset.mode = STATE.adapters; }));
  $$('[data-autonomy]').forEach(b => b.addEventListener('click', () => { STATE.autonomy = b.dataset.autonomy; $$('[data-autonomy]').forEach(x => x.setAttribute('aria-pressed', x === b)); $('#auto-body').innerHTML = autonomyRows(); }));
  $$('.choices button').forEach(b => b.addEventListener('click', () => { STATE.recon = b.dataset.c; $$('.choices button').forEach(x => x.setAttribute('aria-pressed', x === b)); }));
  $('#sheet-close').addEventListener('click', closeSheet);
  $('#sheet-bd').addEventListener('click', closeSheet);
  $('#wt-exit').addEventListener('click', wtExit);
  $('#wt-prev').addEventListener('click', () => { if (STATE.wt > 0) { STATE.wt--; wtApply(true); } });
  $('#wt-next').addEventListener('click', () => { if (STATE.wt < FW.walkthrough.length - 1) { STATE.wt++; wtApply(true); } else wtExit(); });
}
document.addEventListener('click', ev => {
  const d = ev.target.closest('[data-detail]'); if (d) { ev.preventDefault(); openDetail(d.dataset.detail, d); return; }
  const w = ev.target.closest('[data-wt-start]'); if (w) { wtStart(0); return; }
  const lw = ev.target.closest('[data-laws]'); if (lw) { openLaws(lw); return; }
  const g = ev.target.closest('[data-goto]'); if (g) { closeSheet(); const t = document.getElementById(g.dataset.goto); if (t) setTimeout(() => window.scrollTo({ top: scrollY + t.getBoundingClientRect().top - $('#hdr').offsetHeight - 24, behavior: reduce() ? 'auto' : 'smooth' }), 60); return; }
  const lg = ev.target.closest('[data-lang]'); if (lg && lg.dataset.lang !== STATE.lang) { switchLang(lg.dataset.lang); return; }
  const a = ev.target.closest('a[href^="#"]'); if (a) { const id = a.getAttribute('href').slice(1); if (id === 'main') { ev.preventDefault(); $('#main').focus(); return; } const t = id === 'top' ? document.body : document.getElementById(id); if (t) { ev.preventDefault(); window.scrollTo({ top: id === 'top' ? 0 : scrollY + t.getBoundingClientRect().top - ($('#hdr') ? $('#hdr').offsetHeight : 0), behavior: reduce() ? 'auto' : 'smooth' }); } }
});
document.addEventListener('keydown', ev => {
  if (ev.key === 'Escape') { if ($('#sheet') && $('#sheet').classList.contains('open')) { closeSheet(); return; } if (STATE.wt >= 0) { wtExit(); return; } }
  if ((ev.key === 'Enter' || ev.key === ' ') && ev.target.matches && ev.target.matches('g[role="button"][data-detail]')) { ev.preventDefault(); openDetail(ev.target.dataset.detail, ev.target); return; }
  if (STATE.wt >= 0 && !$('#sheet').classList.contains('open') && !ev.target.closest('input,textarea')) {
    if (ev.key === 'ArrowRight') { ev.preventDefault(); $('#wt-next').click(); }
    if (ev.key === 'ArrowLeft') { ev.preventDefault(); $('#wt-prev').click(); }
  }
  if (ev.key === 'Tab' && $('#sheet') && $('#sheet').classList.contains('open')) {
    const fo = $$('#sheet button, #sheet [href], #sheet [tabindex]:not([tabindex="-1"])').filter(n => n.offsetParent !== null);
    if (!fo.length) return; const first = fo[0], last = fo[fo.length - 1];
    if (ev.shiftKey && document.activeElement === first) { ev.preventDefault(); last.focus(); } else if (!ev.shiftKey && document.activeElement === last) { ev.preventDefault(); first.focus(); }
  }
});
function switchLang(lang) {
  const cur = $$('.chapter').find(c => c.getBoundingClientRect().bottom > innerHeight * .3);
  const id = cur && cur.id, off = cur ? cur.getBoundingClientRect().top : 0;
  const wt = STATE.wt;
  STATE.lang = lang; try { localStorage.setItem('dyai-adf-lang', lang); } catch (e) { /* storage unavailable */ }
  render();
  requestAnimationFrame(() => { requestAnimationFrame(() => {
    const c = id && document.getElementById(id); if (c) window.scrollTo({ top: scrollY + c.getBoundingClientRect().top - off, behavior: 'auto' });
    if (wt >= 0) { STATE.wt = wt; $('#wt').classList.add('open'); $('#wt').setAttribute('aria-hidden', 'false'); document.body.classList.add('wt-on'); wtApply(false); }
    const sw = $(`[data-lang="${lang}"]`); sw && sw.focus({ preventScroll: true });
    const live = $('#loc-text'); if (live) live.textContent = lang === 'de' ? 'Sprache: Deutsch' : 'Language: English';
    onScroll();
  }); });
}
let rz; window.addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(layoutAll, 120); });
window.addEventListener('scroll', onScroll, { passive: true });
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => layoutAll());
window.addEventListener('load', () => layoutAll());
render();
window.__ADF = { STATE, layoutAll, setStep, wtStart, wtExit, openDetail };
})();

</script>
